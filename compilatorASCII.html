<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ASCII Art Generator</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1a0f14 0%, #2d1520 50%, #1f0f18 100%);
            color: #e0e0e0;
            min-height: 100vh;
            padding: 20px;
            overflow-x: hidden;
            position: relative;
        }

        /* Canvas для фона */
        #bgCanvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 0;
        }

        .container {
            position: relative;
            z-index: 1;
            max-width: 1200px;
            margin: 0 auto;
        }

        h1 {
            text-align: center;
            margin-bottom: 30px;
            color: #ff8fb3;
            text-shadow: 0 0 20px rgba(255, 143, 179, 0.4);
            letter-spacing: 1px;
        }

        .upload-area {
            background: rgba(255, 255, 255, 0.03);
            border: 2px dashed rgba(255, 107, 157, 0.4);
            border-radius: 12px;
            padding: 40px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-bottom: 30px;
            backdrop-filter: blur(5px);
        }

        .upload-area:hover {
            background: rgba(255, 107, 157, 0.08);
            border-color: rgba(255, 143, 179, 0.7);
        }

        .upload-area.dragover {
            background: rgba(255, 107, 157, 0.15);
            border-color: #ff8fb3;
            transform: scale(1.02);
        }

        .upload-icon {
            font-size: 48px;
            margin-bottom: 15px;
            color: #ff8fb3;
            font-family: 'Courier New', monospace;
            font-weight: bold;
        }

        input[type="file"] {
            display: none;
        }

        .controls {
            background: rgba(45, 21, 32, 0.7);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 107, 157, 0.2);
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 30px;
        }

        .control-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: #ff8fb3;
            font-weight: 500;
        }

        input[type="range"] {
            width: 100%;
            height: 6px;
            border-radius: 3px;
            background: rgba(255, 255, 255, 0.1);
            outline: none;
            -webkit-appearance: none;
        }

        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 18px;
            height: 18px;
            border-radius: 50%;
            background: #ff6b9d;
            cursor: pointer;
            box-shadow: 0 0 10px rgba(255, 107, 157, 0.5);
        }

        input[type="range"]::-moz-range-thumb {
            width: 18px;
            height: 18px;
            border-radius: 50%;
            background: #ff6b9d;
            cursor: pointer;
            border: none;
        }

        select {
            width: 100%;
            padding: 10px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 107, 157, 0.3);
            border-radius: 6px;
            color: #e0e0e0;
            font-size: 14px;
            cursor: pointer;
        }

        select:focus {
            outline: none;
            border-color: #ff8fb3;
        }

        .checkbox-group {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        input[type="checkbox"] {
            width: 18px;
            height: 18px;
            cursor: pointer;
            accent-color: #ff6b9d;
        }

        .preview-container {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 30px;
        }

        .preview-box {
            background: rgba(45, 21, 32, 0.7);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 107, 157, 0.2);
            border-radius: 12px;
            padding: 20px;
            text-align: center;
        }

        .preview-box h3 {
            margin-bottom: 15px;
            color: #ff8fb3;
            font-weight: 400;
            letter-spacing: 1px;
        }

        #imagePreview {
            max-width: 100%;
            max-height: 400px;
            border-radius: 8px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.4);
        }

        .ascii-output {
            background: #0d0d0d;
            border-radius: 8px;
            padding: 15px;
            font-family: 'Courier New', monospace;
            font-size: 10px;
            line-height: 1;
            white-space: pre;
            overflow: auto;
            max-height: 500px;
            color: #ff8fb3;
            text-align: left;
            border: 1px solid rgba(255, 107, 157, 0.15);
        }

        .buttons {
            display: flex;
            gap: 15px;
            justify-content: center;
            flex-wrap: wrap;
        }

        button {
            padding: 12px 30px;
            background: rgba(255, 107, 157, 0.2);
            color: #ffb3d1;
            border: 1px solid rgba(255, 143, 179, 0.4);
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        button:hover {
            background: rgba(255, 107, 157, 0.35);
            border-color: rgba(255, 179, 209, 0.8);
            transform: translateY(-2px);
            box-shadow: 0 4px 15px rgba(255, 107, 157, 0.3);
        }

        button:active {
            transform: translateY(0);
        }

        button:disabled {
            background: rgba(100, 100, 100, 0.2);
            color: #666;
            border-color: #444;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }

        .hidden {
            display: none;
        }

        @media (max-width: 768px) {
            .preview-container {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <!-- Canvas для падающих символов -->
    <canvas id="bgCanvas"></canvas>

    <div class="container">
        <h1>ASCII Art Generator</h1>

        <div class="upload-area" id="uploadArea">
            <div class="upload-icon">@</div>
            <p>Перетащите изображение сюда или нажмите для выбора</p>
            <p style="font-size: 14px; color: #8a6a7a; margin-top: 10px;">
                Поддерживаются: JPG, PNG, GIF, WebP
            </p>
            <input type="file" id="fileInput" accept="image/*">
        </div>

        <div class="controls hidden" id="controls">
            <div class="control-group">
                <label for="widthSlider">Ширина: <span id="widthValue">100</span> символов</label>
                <input type="range" id="widthSlider" min="50" max="200" value="100">
            </div>

            <div class="control-group">
                <label for="charsetSelect">Набор символов:</label>
                <select id="charsetSelect">
                    <option value="detailed">Детальный (@%#*+=-:. )</option>
                    <option value="simple">Простой (#@%*+=-:. )</option>
                    <option value="blocks">Блоки (█▓▒░ )</option>
                    <option value="dots">Точки (●◉○· )</option>
                </select>
            </div>

            <div class="control-group checkbox-group">
                <input type="checkbox" id="invertCheck">
                <label for="invertCheck" style="margin: 0;">Инвертировать</label>
            </div>

            <button id="generateBtn">Сгенерировать ASCII</button>
        </div>

        <div class="preview-container hidden" id="previewContainer">
            <div class="preview-box">
                <h3>Оригинал</h3>
                <img id="imagePreview" alt="Preview">
            </div>
            <div class="preview-box">
                <h3>ASCII Art</h3>
                <div class="ascii-output" id="asciiOutput">Здесь появится результат...</div>
            </div>
        </div>

        <div class="buttons hidden" id="buttons">
            <button id="copyBtn">Копировать</button>
            <button id="downloadBtn">Скачать</button>
        </div>
    </div>

    <script>
        /* ==========================================
           ЛОГИКА ФОНА: ПАДАЮЩИЕ СИМВОЛЫ (CANVAS)
           ========================================== */
        const canvas = document.getElementById('bgCanvas');
        const ctx = canvas.getContext('2d');

        let width = canvas.width = window.innerWidth;
        let height = canvas.height = window.innerHeight;

        // Только разрешённые символы
        const chars = "@%#*+=-:. ".split("");
        
        // Размер шрифта для "больших вертикальных строчек"
        const fontSize = 32; 
        const columns = Math.floor(width / fontSize);
        
        // Массив для отслеживания Y-координаты каждой колонки
        // Инициализируем отрицательными значениями, чтобы дождь начинался не одновременно
        const drops = [];
        for (let i = 0; i < columns; i++) {
            drops[i] = Math.random() * -50; 
        }

        function drawRain() {
            // Полупрозрачный фон для создания эффекта мягкого шлейфа
            ctx.fillStyle = 'rgba(26, 15, 20, 0.15)';
            ctx.fillRect(0, 0, width, height);

            ctx.font = `bold ${fontSize}px "Courier New", monospace`;
            ctx.textAlign = "center";

            for (let i = 0; i < drops.length; i++) {
                // Случайный символ из разрешённого набора
                const text = chars[Math.floor(Math.random() * chars.length)];
                
                // Полупрозрачный розовый цвет с эффектом свечения
                ctx.fillStyle = 'rgba(255, 107, 157, 0.25)';
                ctx.shadowBlur = 15;
                ctx.shadowColor = 'rgba(255, 107, 157, 0.5)';
                
                // Рисуем символ
                const x = i * fontSize + fontSize / 2;
                const y = drops[i] * fontSize;
                ctx.fillText(text, x, y);

                // Сброс капли наверх со случайной задержкой после выхода за экран
                if (y > height && Math.random() > 0.975) {
                    drops[i] = 0;
                }
                
                // Двигаем каплю вниз
                drops[i]++;
            }
        }

        // Запускаем анимацию (~30 FPS для плавного, но заметного движения)
        setInterval(drawRain, 50);

        // Адаптация при изменении размера окна
        window.addEventListener('resize', () => {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
            
            const newColumns = Math.floor(width / fontSize);
            // Сохраняем старые капли, добавляем новые при необходимости
            for (let i = drops.length; i < newColumns; i++) {
                drops[i] = Math.random() * -50;
            }
            // Обрезаем массив, если окно сузилось
            drops.length = newColumns;
        });


        /* ==========================================
           ЛОГИКА ASCII ГЕНЕРАТОРА
           ========================================== */
        const charsets = {
            detailed: '@%#*+=-:. ',
            simple: '#@%*+=-:. ',
            blocks: '█▓▒░ ',
            dots: '●◉○· '
        };

        let currentImage = null;

        const uploadArea = document.getElementById('uploadArea');
        const fileInput = document.getElementById('fileInput');
        const controls = document.getElementById('controls');
        const previewContainer = document.getElementById('previewContainer');
        const buttons = document.getElementById('buttons');
        const imagePreview = document.getElementById('imagePreview');
        const asciiOutput = document.getElementById('asciiOutput');
        const widthSlider = document.getElementById('widthSlider');
        const widthValue = document.getElementById('widthValue');
        const charsetSelect = document.getElementById('charsetSelect');
        const invertCheck = document.getElementById('invertCheck');
        const generateBtn = document.getElementById('generateBtn');
        const copyBtn = document.getElementById('copyBtn');
        const downloadBtn = document.getElementById('downloadBtn');

        uploadArea.addEventListener('click', () => fileInput.click());

        uploadArea.addEventListener('dragover', (e) => {
            e.preventDefault();
            uploadArea.classList.add('dragover');
        });

        uploadArea.addEventListener('dragleave', () => {
            uploadArea.classList.remove('dragover');
        });

        uploadArea.addEventListener('drop', (e) => {
            e.preventDefault();
            uploadArea.classList.remove('dragover');
            const file = e.dataTransfer.files[0];
            if (file && file.type.startsWith('image/')) {
                handleFile(file);
            }
        });

        fileInput.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (file) {
                handleFile(file);
            }
        });

        function handleFile(file) {
            const reader = new FileReader();
            reader.onload = (e) => {
                currentImage = e.target.result;
                imagePreview.src = currentImage;
                
                controls.classList.remove('hidden');
                previewContainer.classList.remove('hidden');
                
                generateASCII();
            };
            reader.readAsDataURL(file);
        }

        widthSlider.addEventListener('input', (e) => {
            widthValue.textContent = e.target.value;
        });

        generateBtn.addEventListener('click', generateASCII);

        function generateASCII() {
            if (!currentImage) return;

            const img = new Image();
            img.onload = () => {
                const canvas = document.createElement('canvas');
                const ctx = canvas.getContext('2d');

                const width = parseInt(widthSlider.value);
                const aspectRatio = img.height / img.width;
                const height = Math.floor(width * aspectRatio * 0.55);

                canvas.width = width;
                canvas.height = height;

                ctx.drawImage(img, 0, 0, width, height);
                const imageData = ctx.getImageData(0, 0, width, height);
                const pixels = imageData.data;

                let chars = charsets[charsetSelect.value];
                if (invertCheck.checked) {
                    chars = chars.split('').reverse().join('');
                }

                let ascii = '';
                for (let y = 0; y < height; y++) {
                    for (let x = 0; x < width; x++) {
                        const index = (y * width + x) * 4;
                        const r = pixels[index];
                        const g = pixels[index + 1];
                        const b = pixels[index + 2];

                        const brightness = (r + g + b) / 3;
                        const charIndex = Math.floor(brightness * (chars.length - 1) / 255);
                        ascii += chars[charIndex];
                    }
                    ascii += '\n';
                }

                asciiOutput.textContent = ascii;
                buttons.classList.remove('hidden');
            };
            img.src = currentImage;
        }

        copyBtn.addEventListener('click', () => {
            const text = asciiOutput.textContent;
            navigator.clipboard.writeText(text).then(() => {
                const originalText = copyBtn.textContent;
                copyBtn.textContent = 'Скопировано';
                setTimeout(() => {
                    copyBtn.textContent = originalText;
                }, 2000);
            });
        });

        downloadBtn.addEventListener('click', () => {
            const text = asciiOutput.textContent;
            const blob = new Blob([text], { type: 'text/plain' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = 'ascii-art.txt';
            a.click();
            URL.revokeObjectURL(url);
        });

        charsetSelect.addEventListener('change', generateASCII);
        invertCheck.addEventListener('change', generateASCII);
    </script>
</body>
</html>
